# Sends the daily "log your tips" push notification.
# Runs every hour; scripts/send-nudges.js decides who is due based on each device's time zone
# and each budget's reminder hour. Free on GitHub's Actions allowance.
name: Daily nudge
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/send-nudges.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          APP_NAME: Cashout
