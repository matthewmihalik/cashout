<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashout</title>
<meta name="description" content="Tip-based weekly budget: log shifts and purchases, close the week, track funds and bills.">
<meta name="theme-color" content="#1B0F17" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFF3F8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cashout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Sign-in screen (shown until Firebase confirms a user) -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <img src="icons/icon-192.png" alt="" width="64" height="64" style="border-radius:16px">
    <h1 id="authTitle">Cashout</h1>
    <p>Your tips, sorted every week. Sign in to open your ledger — or the one you were invited to.</p>
    <button class="btn primary block" id="googleBtn">Continue with Google</button>
    <div class="auth-or"><span>or use email</span></div>
    <form id="emailForm" class="stack">
      <input class="input" type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required>
      <input class="input" type="password" id="authPass" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
      <div class="sheet-actions"><button type="submit" class="btn" id="signInBtn">Sign in</button><button type="button" class="btn ghost" id="signUpBtn">Create account</button></div>
    </form>
    <p class="hint" id="authMsg"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><h1 id="brandName">Cashout</h1><span class="day" id="todayLabel"></span></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <section class="view active" id="view-home"></section>
  <section class="view" id="view-insights"></section>
  <section class="view" id="view-bills"></section>
  <section class="view" id="view-settings"></section>
  <section class="view" id="view-setup"></section>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <div class="inner">
    <button class="tab active" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="tab" data-view="insights"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 5-7"/></svg><span>Insights</span></button>
    <button class="tab log" id="logTab"><div class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><span>Log</span></button>
    <button class="tab" data-view="bills"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Bills</span></button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip"></div>

<!-- Firebase (compat builds so the app stays plain script files, no bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-messaging-compat.js"></script>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/more.js"></script>
<script src="js/auth.js"></script>
<script src="js/push.js"></script>
<script src="js/app.js"></script>
</body>
</html>
